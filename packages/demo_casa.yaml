template:
  - light:
      - name: "Sala Principal"
        unique_id: demo_light_sala_principal
        state: "{{ is_state('input_boolean.demo_luz_sala_principal', 'on') }}"
        brightness: "{{ (states('input_number.demo_brilho_sala_principal') | float(70) * 2.55) | int }}"
        turn_on:
          - service: input_boolean.turn_on
            target:
              entity_id: input_boolean.demo_luz_sala_principal
        turn_off:
          - service: input_boolean.turn_off
            target:
              entity_id: input_boolean.demo_luz_sala_principal
        set_level:
          - service: input_number.set_value
            target:
              entity_id: input_number.demo_brilho_sala_principal
            data:
              value: "{{ (brightness / 255 * 100) | round(0) }}"
