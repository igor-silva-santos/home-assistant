automation:
  - id: demo_campainha_auto_off
    alias: "Demo — Campainha auto reset"
    trigger:
      - platform: state
        entity_id: input_boolean.demo_campainha
        to: "on"
        for:
          seconds: 8
    action:
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.demo_campainha
    mode: single
