      primary: "Alerta Consumo Alto"
      secondary: >
        {% set auto = states.automation.alerta_consumo_anomalo %}
        Última execução: {{ auto.attributes.last_triggered | as_datetime | as_local | relative_time if auto.attributes.last_triggered else 'Nunca' }}
        | Notifica quando consumo > 20% acima da média
      icon: mdi:alert-octagon
      icon_color: >
        {% if is_state('automation.alerta_consumo_anomalo','on') %}red{% else %}disabled{% endif %}
      tap_action:
        action: call-service
        service: automation.toggle
