        | Dispara notify + Alexa nos horários configurados
      icon: mdi:bell-ring
      icon_color: >
        {% if is_state('automation.notificacao_lembrete','on') %}cyan{% else %}disabled{% endif %}
      tap_action:
        action: call-service
        service: automation.toggle
        service_data:
          entity_id: automation.notificacao_lembrete
      card_mod:
        style: |
          ha-card {
            background: linear-gradient(135deg, rgba(0,212,255,0.05) 0%, transparent 100%) !important;
            border: 1px solid rgba(0,212,255,0.1) !important;
            cursor: pointer;
          }

# ── Dica de uso ───────────────────────────────────────────────
- type: custom:mushroom-template-card
  primary: "💡 Dica"
  secondary: "Toque para ativar/desativar | Segure para executar agora"
  icon: mdi:information
  icon_color: cyan
  card_mod:
    style: |
      ha-card {
        background: rgba(0,212,255,0.03) !important;
        border: 1px dashed rgba(0,212,255,0.2) !important;
      }
      .primary { color: #00d4ff !important; }
