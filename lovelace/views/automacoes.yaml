          entity_id: automation.alerta_consumo_anomalo
      card_mod:
        style: |
          ha-card {
            background: linear-gradient(135deg, rgba(255,51,102,0.05) 0%, transparent 100%) !important;
            border: 1px solid rgba(255,51,102,0.1) !important;
            cursor: pointer;
          }

- type: custom:mushroom-title-card
