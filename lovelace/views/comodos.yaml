# ══════════════════════════════════════════════════════════════
#  VIEW: CÔMODOS — Controle por Ambiente
# ══════════════════════════════════════════════════════════════

- type: custom:mushroom-title-card
  title: "🏢 Cômodos"
  subtitle: "Controle completo de cada ambiente"
  card_mod:
    style: |
      ha-card { background: transparent !important; border: none !important; }

# ── Sala ─────────────────────────────────────────────────────
- type: custom:room-card
  room: sala
  name: "Sala de Estar"
  icon: mdi:sofa-single
  show_header: true
  layout: grid
  entities:
    - entity: light.sala_principal
      name: "Luz Principal"
      icon: mdi:ceiling-light
      show_brightness: true
    - entity: light.sala_abajur
      name: "Abajur"
      icon: mdi:floor-lamp
      show_brightness: true
    - entity: switch.tv_sala
      name: "TV 65\""
      icon: mdi:television
      show_power: true
    - entity: switch.som_sala
      name: "Sistema de Som"
      icon: mdi:speaker
    - entity: sensor.temperatura_sala
      name: "Temperatura"
      icon: mdi:thermometer
      type: sensor
    - entity: binary_sensor.movimento_sala
      name: "Movimento"
      icon: mdi:motion-sensor
      type: sensor

