# ── Controles Master ──────────────────────────────────────────
- type: custom:mushroom-title-card
  title: "⚡ Controles Gerais"
  subtitle: "Liga/desliga todos os dispositivos de uma área"

- type: horizontal-stack
  cards:
    - type: custom:mushroom-template-card
      primary: "Todas as Luzes OFF"
      icon: mdi:lightbulb-group-off
      icon_color: red
      tap_action:
        action: call-service
        service: light.turn_off
        service_data:
          entity_id: all
      card_mod:
        style: |
          ha-card { cursor: pointer; }
          ha-card:hover { box-shadow: 0 0 20px rgba(255,51,102,0.4) !important; }

    - type: custom:mushroom-template-card
      primary: "Todas as Luzes ON"
      icon: mdi:lightbulb-group
      icon_color: yellow
      tap_action:
        action: call-service
        service: light.turn_on
        service_data:
          entity_id: all
      card_mod:
        style: |
          ha-card { cursor: pointer; }
          ha-card:hover { box-shadow: 0 0 20px rgba(255,215,0,0.4) !important; }

    - type: custom:mushroom-template-card
      primary: "Modo Ausente"
      secondary: "Desliga tudo e ativa alarme"
      icon: mdi:home-export-outline
      icon_color: purple
      tap_action:
        action: call-service
        service: input_select.select_option
        service_data:
          entity_id: input_select.modo_casa
          option: Ausente
      card_mod:
        style: |
          ha-card { cursor: pointer; }
