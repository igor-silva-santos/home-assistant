# ══════════════════════════════════════════════════════════════
#  VIEW: CÔMODOS (AUTO) — entidades por Área do HA
#  Requer: HACS → auto-entities + áreas configuradas no HA
#  Ver docs/AREAS.md — nomes de área abaixo devem bater com os seus
# ══════════════════════════════════════════════════════════════

- type: markdown
  content: >
    **Modo automático** — lista dispositivos pela **Área** nativa do Home Assistant.
    Instale **auto-entities** (HACS) e ajuste os nomes `area:` se suas áreas forem diferentes
    (Configurações → Áreas). Para controle visual com `room-card`, use a aba **Cômodos**.

- type: custom:mushroom-title-card
  title: "Sala"
  subtitle: "auto-entities · area: Sala"
  card_mod:
    style: |
      ha-card { background: transparent !important; border: none !important; }

- type: custom:auto-entities
  card:
    type: entities
    title: Dispositivos
    show_header_toggle: true
  filter:
    include:
      - area: Sala
        domain:
          - light
          - switch
          - climate
          - fan
          - cover
          - sensor
          - binary_sensor
    exclude:
      - entity_id: sensor.saudacao
  sort:
    method: name

